<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/sea.png" />
    <title>My Site</title>

    <style>
        * {
            /* background-color: rgb(168, 108, 108); */
            margin: 0px;
            color: rgb(54, 68, 80);
        }

        .container-1 {
            height: 700px;
            width: auto;
            background-color: gray;
            padding-left: 10px;
            background-image: url("sea.png");
            /* display: block; */
            align-content: center;
        }

        .short-p {
            font-size: 12px;
            color: gray;

        }

        .heading {
            font-weight: 20px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 40px;

        }

        .para {
            font-size: 20px;
            color: rgb(58, 58, 90);
            font-family: 'Times New Roman', Times, serif;

        }

        .container-sub{
            margin-top: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-watch {
            color: rgb(0, 0, 0);
            font-size: 15px;
            font-weight: bold;
            /* outline: none; */
            border: none;
            width: 100px;
            height: 40px;
            border-radius: 10px;
            text-decoration: none;
            background-color: rgb(160, 236, 140);
        }

        #btn-book {
            width: 30px;
            height: 30px;
            /* box-shadow: 1px 1px 10px yellow; */

        }

        .btn-watch:hover {
            cursor: pointer;
        }
        #btn-book:hover{
            cursor: pointer;
        }
    </style>

</head>

<body>
    <div class="container-1">
        <p class="short-p">14+ age, blah blah blah</p>
        <h1 class="heading">Welcome to Cox's Bazar</h1>
        <p class="para">Lorem ipsum dolor sit amet consectetur adipisicing elit. Nobis et ipsum laudantium qui
            consequuntur dolores saepe facere recusandae possimus dolorum
        </p>
        <div class="container-sub">
            <button class="btn-watch">Watch now</button>
            <img src="/bookmark.png" alt="bookmark" id="btn-book">
        </div>
    </div>

    
</body>

</html>
